<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Урмат Жакыпов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #07060f;
      --bg-2: #12081c;
      --card: rgba(18, 16, 28, 0.62);
      --text: #f4f1ff;
      --muted: #b7b0c9;
      --cyan: #5ce1ff;
      --magenta: #ff4fd8;
      --line: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: "Outfit", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 520px at 18% -8%, rgba(255, 79, 216, 0.28), transparent 55%),
        radial-gradient(820px 480px at 108% 8%, rgba(92, 225, 255, 0.22), transparent 52%),
        radial-gradient(640px 420px at 50% 112%, rgba(124, 77, 255, 0.2), transparent 58%),
        linear-gradient(165deg, var(--bg-1), var(--bg-2) 48%, #0b1220);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
    }

    .card {
      width: min(440px, 100%);
      text-align: center;
      padding: 42px 22px 28px;
      border-radius: 28px;
      background: var(--card);
      border: 1px solid var(--line);
      backdrop-filter: blur(18px);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .avatar-wrap {
      width: 128px;
      height: 128px;
      margin: 0 auto 22px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--cyan), #8b5cf6 48%, var(--magenta));
      box-shadow: 0 0 36px rgba(92, 225, 255, 0.22);
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 12%;
      border-radius: 50%;
      display: block;
      border: 3px solid #0b0a12;
    }

    h1 {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: clamp(1.7rem, 6vw, 2.15rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .bio {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
      max-width: 40ch;
      margin: 0 auto 28px;
      text-wrap: pretty;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 62px;
      padding: 0 20px;
      border-radius: 18px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      font-size: 1.08rem;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--line);
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .emoji {
      font-size: 1.28rem;
      line-height: 1;
    }

    .link:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(92, 225, 255, 0.35);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
    }

    .link:active,
    .link.is-pressed {
      transform: translateY(0) scale(0.985);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(16px);
      opacity: 0;
      pointer-events: none;
      background: #16141f;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 0.88rem;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 480px) {
      body {
        padding: 18px 14px;
        align-items: flex-start;
      }

      .card {
        padding: 32px 16px 22px;
        border-radius: 22px;
      }

      .avatar-wrap {
        width: 108px;
        height: 108px;
      }

      .bio {
        font-size: 0.92rem;
        margin-bottom: 22px;
      }

      .link {
        min-height: 58px;
        font-size: 1.04rem;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar-wrap">
      <img src="avatar2.png" alt="Урмат Жакыпов">
    </div>
    <h1>Урмат Жакыпов</h1>
    <p class="bio">Дуйнодогу эн кымбат ашпозчунун досунун тагасынын байкеси болчу, бирок Тайландка барып келип эжеси болуп калды, эмне кылайылы биз эми, айла жок, азыр заман ушундай.</p>
    <nav class="links">
      <a class="link" href="https://t.me/" target="_blank" rel="noopener noreferrer">
        <span class="emoji" aria-hidden="true">✈️</span>
        Telegram
      </a>
      <a class="link" href="https://instagram.com/" target="_blank" rel="noopener noreferrer">
        <span class="emoji" aria-hidden="true">📸</span>
        Instagram
      </a>
      <a class="link" href="https://youtube.com/" target="_blank" rel="noopener noreferrer">
        <span class="emoji" aria-hidden="true">▶️</span>
        YouTube
      </a>
      <a class="link" href="https://wa.me/" target="_blank" rel="noopener noreferrer">
        <span class="emoji" aria-hidden="true">💬</span>
        WhatsApp
      </a>
      <a class="link" id="email-link" href="mailto:urmat.zhakypov@example.com">
        <span class="emoji" aria-hidden="true">✉️</span>
        Email
      </a>
    </nav>
  </main>
  <div class="toast" id="toast" role="status">Адрес скопирован</div>

  <script>
    const links = document.querySelectorAll(".link");
    const toast = document.getElementById("toast");
    const emailLink = document.getElementById("email-link");
    let toastTimer;

    links.forEach((link) => {
      link.addEventListener("pointerdown", () => link.classList.add("is-pressed"));
      link.addEventListener("pointerup", () => link.classList.remove("is-pressed"));
      link.addEventListener("pointerleave", () => link.classList.remove("is-pressed"));
    });

    emailLink.addEventListener("click", async (event) => {
      const email = emailLink.href.replace("mailto:", "");
      try {
        await navigator.clipboard.writeText(email);
        event.preventDefault();
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
      } catch {
        /* fallback: open mail client */
      }
    });
  </script>
</body>
</html>
